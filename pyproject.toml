[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "donger-py"
version = "0.1.0"
description = "Grok-powered Streamlit application for chat, multimodal analysis, and document retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Terry Eppler"}]
license = "MIT"
license-files = ["LICENSE.txt"]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/is-leeroy-jenkins/donger"
Documentation = "https://is-leeroy-jenkins.github.io/donger/"
Issues = "https://github.com/is-leeroy-jenkins/donger/issues"

[project.scripts]
donger = "donger.cli:desktop"
donger-browser = "donger.cli:main"

[tool.setuptools]
packages = ["donger"]
package-dir = {donger = "."}
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-runtime.txt"]}

[tool.setuptools.package-data]
donger = ["resources/**/*.png", "resources/**/*.ico", ".streamlit/config.toml"]

